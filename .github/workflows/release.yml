# A release is a pushed tag and nothing else. Everything below is derived from it: the version is
# checked against the one in Directory.Build.props, the notes are the CHANGELOG section named after
# it, the image is published to the registry under the same number, and one archive per platform is
# attached so that running merchant needs neither a checkout nor an SDK.
#
# To cut one: bump <Version>, write the CHANGELOG section, commit both, then
#   git tag -a v1.2.0 -m "merchant v1.2.0" && git push --follow-tags
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # Everything that can refuse the release happens here, before anything is built for five
  # platforms and two architectures. A tag that should not have been pushed costs one short job.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The tag is a claim about what is being released, and Directory.Build.props is what the
      # binary will actually report. A release where those disagree ships a build that lies about
      # its own version, so it is refused here rather than discovered later.
      - name: The tag and the version agree
        id: version
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          tag="${GITHUB_REF_NAME#v}"

          if [ "$version" != "$tag" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match <Version>${version}</Version> in" \
                 "Directory.Build.props. Bump one of them." >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_OUTPUT"

      # A released version whose changes nobody wrote down is the version somebody upgrading cannot
      # judge, so the section has to exist before the release does.
      - name: The CHANGELOG has a section for it
        id: notes
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="## ${version}" '
            $0 ~ "^" v " " || $0 == v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "No '## ${version}' section in CHANGELOG.md. Write one and re-tag." >&2
            exit 1
          fi

      - name: Test
        run: dotnet test -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  # One archive per platform, so that somebody who wants to run merchant and not work on it needs
  # neither the repository nor the SDK. Each is self-contained — the .NET runtime is inside the
  # executable — and single-file, because the alternative is asking a person to keep a directory of
  # a couple of hundred files intact. Nothing is trimmed: Discord.Net finds command modules by
  # reflection, so a trimmed build loses its commands at run time rather than at build time.
  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: linux-x64
          - rid: linux-arm64
          - rid: osx-x64
          - rid: osx-arm64
          - rid: win-x64
            exe: .exe
            zip: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Cross-publishing every target from one runner is only possible because none of this is
      # trimmed or AOT-compiled: the bundler copies a runtime it never has to execute.
      - name: Publish ${{ matrix.rid }}
        env:
          VERSION: ${{ needs.check.outputs.version }}
          RID: ${{ matrix.rid }}
          EXE: ${{ matrix.exe }}
        run: |
          stage="stage/merchant-${VERSION}-${RID}"
          mkdir -p "$stage"

          dotnet publish src/Merchant/Merchant.csproj \
            -c Release \
            -r "$RID" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -o publish

          cp "publish/merchant${EXE}" "$stage/"

          # The settings file and the token file are the whole interface, so the examples travel
          # with the binary. Without them the download is an executable that names a path nobody
          # has been shown how to write.
          cp deploy/appsettings.example.jsonc deploy/merchant.env.example "$stage/"

      - name: Archive ${{ matrix.rid }}
        env:
          VERSION: ${{ needs.check.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          name="merchant-${VERSION}-${RID}"
          mkdir -p dist

          if [ "${{ matrix.zip }}" = "true" ]; then
            (cd stage && zip -qr "../dist/${name}.zip" "$name")
          else
            tar czf "dist/${name}.tar.gz" -C stage "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  image:
    needs: check
    runs-on: ubuntu-latest
    # The build record is a provenance blob for the registry's own UI. Nothing here reads it, and
    # leaving it on means an artifact the release job has to know to ignore.
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
      DOCKER_BUILD_SUMMARY: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 as well as amd64: a Discord bot that posts a few embeds an hour is exactly what ends
      # up on a Raspberry Pi, and cross-building the SDK image on the Pi itself is punishing.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.check.outputs.image }}:${{ needs.check.outputs.version }}
            ${{ needs.check.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Last, and only once the image and every archive exist. A release that appears before its
  # downloads do is a release somebody follows to an empty page.
  release:
    needs: [check, build, image]
    runs-on: ubuntu-latest
    steps:
      # Named rather than "everything this run produced": an action is free to upload artifacts of
      # its own, and a release job that collects whatever it finds fails on the first one that does.
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: notes

      # A checksum file is what somebody who downloaded over a network they do not trust can act
      # on. It is written in the directory the archives are in, so the names in it are the names on
      # the release page.
      - name: Checksum the archives
        run: |
          cd dist
          sha256sum merchant-* > SHA256SUMS
          cat SHA256SUMS

      # GH_REPO because this job holds the archives and nothing else: there is no checkout here for
      # gh to read the repository out of, and it has no other reason to want one.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "merchant ${GITHUB_REF_NAME}" \
            --notes-file notes/notes.md \
            dist/*
